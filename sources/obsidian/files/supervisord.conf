# cspell:ignore autorestart childlogdir fluxbox logfile nodaemon nopw novnc pidfile
# cspell:ignore rfbport startretries startsecs supervisord websockify maxbytes
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisor/supervisord.pid
user=root

[program:xvfb]
command=/usr/local/bin/xvfb-start.sh
autorestart=true
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fluxbox]
command=/usr/bin/fluxbox -display :99
autorestart=true
priority=200
environment=DISPLAY=":99",HOME="/home/obsidian"
user=obsidian
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -rfbport 5900
autorestart=true
priority=300
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5900
autorestart=true
priority=400
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:obsidian]
command=/usr/bin/obsidian --no-sandbox --disable-gpu-sandbox /vault
autorestart=true
startsecs=5
startretries=999
priority=500
environment=DISPLAY=":99",HOME="/home/obsidian",XDG_CONFIG_HOME="/config"
user=obsidian
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
