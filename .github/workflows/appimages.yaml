---
name: app-images
on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:
jobs:
  define-matrix:
    name: define matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      images: ${{ steps.define-matrix.outputs.images }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true
      - name: define matrix
        id: define-matrix
        run: |
          # Patterns of container names that produce an AppImage.
          # Add new entries here when a new AppImage-capable image appears.
          _appimage_patterns=(
            '^ansible-[0-9]{2}$'
            '^mkosi-'
            '^texlive-'
          )
          _jq_tests="$(printf ' or test("%s")' "${_appimage_patterns[@]}")"
          _jq_tests="${_jq_tests# or }"
          source _shared/_all/matrix.sh
          FILTERED="$(
            printf '%s' "${DIR_SON}" |
              jq -Mc "[.[] | select(${_jq_tests})] | unique"
          )"
          [[ "${FILTERED}" == '[]' ]] && FILTERED='["__skip__"]'
          echo "images=${FILTERED}" >> "${GITHUB_OUTPUT}"
      - name: create release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: AppImage [v${{ github.ref_name }}] binaries
          body: version [${{ github.ref_name }}] of AppImage binaries
  appimage:
    name: "build ${{ matrix.image }} AppImage"
    needs: define-matrix
    if: ${{ !contains(fromJSON(needs.define-matrix.outputs.images), '__skip__') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.define-matrix.outputs.images) }}
    timeout-minutes: 22
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
      - name: build ${{ matrix.image }} AppImage
        run: |
          sudo ./podman.sh
          _img='${{ matrix.image }}'
          # Images that use ansible-appimage as their build container.
          # Everyone else builds from their own image.
          _ansible_appimage_patterns=(
            '^ansible-[0-9]{2}$'
          )
          _dirs="${_img}/"
          for _p in "${_ansible_appimage_patterns[@]}"; do
            if [[ "${_img}" =~ ${_p} ]]; then
              _dirs='ansible-appimage/'
              break
            fi
          done
          MANUAL_IMAGES_DIRS="${_dirs}" _shared/_all/build.sh
          TAG="${_img}" _shared/_all/appimage.sh
      - name: make draft and upload AppImage
        if: >-
          github.event_name == 'pull_request' || (
            (github.event_name == 'push')
          ) && github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          name: >
            branch [${{
              github.head_ref == '' && github.ref_name || github.head_ref
            }}] of AppImage binaries
          draft: true
          allowUpdates: true
          tag: v999
          artifacts: "appimage-output/*.AppImage"
          body: >
            branch [${{
              github.head_ref == '' && github.ref_name || github.head_ref
            }}] of AppImage binaries from recent commit by GitHub actions
      - name: make release and upload AppImage
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "appimage-output/*.AppImage"
          name: AppImage [v${{ github.ref_name }}] binaries
          body: version [${{ github.ref_name }}] of AppImage binaries
